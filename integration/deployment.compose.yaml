# Runtime fixture layered over the documented deployment; dependencies stay private.
services:
  ingress:
    ports: !override
      - "127.0.0.1:${DANS_DEPLOY_TLS_PORT:?}:8443"

  postgres:
    image: ${POSTGRES_IMAGE:?}
    environment:
      POSTGRES_DB: dans
      POSTGRES_USER: dans_ddl
      POSTGRES_PASSWORD: dans-ddl
    volumes:
      - ${DANS_DEPLOY_ROOT:?}/integration/postgres/init.sql:/docker-entrypoint-initdb.d/10-runtime-role.sql:ro
    networks: [database-private]

  powerdns:
    image: powerdns/pdns-auth-51:5.1.3
    environment:
      PDNS_AUTH_API_KEY: dans_v1_AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    ports:
      - "127.0.0.1:${DANS_DEPLOY_DNS_PORT:?}:53/udp"
      - "127.0.0.1:${DANS_DEPLOY_DNS_PORT:?}:53/tcp"
    networks: [powerdns-control, dns-test]

networks:
  dns-test:
