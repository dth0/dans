apiVersion: v1
kind: Namespace
metadata:
  name: dans
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dans
  namespace: dans
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dans
  namespace: dans
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: dans
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dans
    spec:
      serviceAccountName: dans
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dans
          image: ghcr.io/ncode/dans:RELEASE
          imagePullPolicy: IfNotPresent
          args: ["serve"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: DANS_LISTEN
              value: "0.0.0.0:8080"
            - name: DANS_DATABASE_URL_FILE
              value: /run/secrets/dans/database-url
            - name: DANS_POWERDNS_URL
              value: http://powerdns-api.powerdns.svc.cluster.local:8081
            - name: DANS_POWERDNS_UPSTREAM
              value: powerdns
            - name: DANS_POWERDNS_API_KEY_FILE
              value: /run/secrets/dans/powerdns-api-key
            - name: DANS_RATE_LIMIT_ENABLED
              value: "true"
            - name: DANS_REDIS_URL_FILE
              value: /run/secrets/dans/redis-url
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /livez
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: runtime-secrets
              mountPath: /run/secrets/dans
              readOnly: true
      volumes:
        - name: runtime-secrets
          secret:
            secretName: dans-runtime
            defaultMode: 0440
---
# Disposable rate-limit state shared by the DANS replicas: no persistence,
# reachable only from DANS pods, and an ACL user limited to bucket commands.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dans-redis
  namespace: dans
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dans-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dans-redis
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:8.10.2
          imagePullPolicy: IfNotPresent
          args: ["redis-server", "--save", "", "--appendonly", "no", "--aclfile", "/run/secrets/redis/users.acl"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: redis
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: acl
              mountPath: /run/secrets/redis
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: acl
          secret:
            secretName: dans-redis-acl
            defaultMode: 0440
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: dans-redis
  namespace: dans
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dans-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: v1
kind: Service
metadata:
  name: dans
  namespace: dans
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dans
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dans
  namespace: dans
spec:
  ingressClassName: trusted
  tls:
    - hosts: ["dans.example.com"]
      secretName: dans-tls
  rules:
    - host: dans.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dans
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dans-private-boundary
  namespace: dans
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: dans
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              networking.dans.io/trusted-ingress: "true"
          podSelector:
            matchLabels:
              app.kubernetes.io/component: controller
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              networking.dans.io/postgresql: "true"
          podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              networking.dans.io/powerdns: "true"
          podSelector:
            matchLabels:
              app.kubernetes.io/name: powerdns
      ports:
        - protocol: TCP
          port: 8081
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: dans-redis
      ports:
        - protocol: TCP
          port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dans-redis-from-dans-only
  namespace: dans
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: dans-redis
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: dans
      ports:
        - protocol: TCP
          port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: powerdns-api-from-dans-only
  namespace: powerdns
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: powerdns
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: dans
          podSelector:
            matchLabels:
              app.kubernetes.io/name: dans
      ports:
        - protocol: TCP
          port: 8081
