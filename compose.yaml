name: ${COMPOSE_PROJECT_NAME:-dans-dev}

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16.14}
    environment:
      POSTGRES_DB: dans
      POSTGRES_USER: dans_ddl
      POSTGRES_PASSWORD: dans-ddl
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dans_ddl -d dans"]
      interval: 1s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./integration/postgres/init.sql:/docker-entrypoint-initdb.d/10-runtime-role.sql:ro
      - ./internal/database/privileges/runtime.sql:/dans/runtime.sql:ro
    networks: [control]

  powerdns:
    image: ${POWERDNS_IMAGE:-powerdns/pdns-auth-51:5.1.3}
    environment:
      PDNS_AUTH_API_KEY: dans_v1_AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    ports:
      - "127.0.0.1:${DANS_DEV_DNS_PORT:-1053}:53/tcp"
      - "127.0.0.1:${DANS_DEV_DNS_PORT:-1053}:53/udp"
    volumes:
      - powerdns-data:/var/lib/powerdns
    networks: [control, ingress]

  # Disposable rate-limit state: persistence is off and no port is published.
  redis:
    image: ${REDIS_IMAGE:-redis:8.10.2}
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
    networks: [control]

  dans:
    image: ${COMPOSE_PROJECT_NAME:-dans-dev}:local
    build:
      context: .
      args:
        GOLANG_IMAGE: ${GOLANG_IMAGE:-golang:1.26.5-alpine@sha256:0178a641fbb4858c5f1b48e34bdaabe0350a330a1b1149aabd498d0699ff5fb2}
        NODE_IMAGE: ${NODE_IMAGE:-node:24-alpine}
        VERSION: dev
    command: ["serve"]
    environment:
      DANS_LISTEN: 0.0.0.0:8080
      DANS_BROWSER_COOKIE_MODE: development-http
      DANS_DATABASE_URL: postgres://dans_runtime:dans-runtime@postgres/dans?sslmode=disable
      DANS_POWERDNS_URL: http://powerdns:8081
      DANS_POWERDNS_UPSTREAM: dev
      DANS_POWERDNS_API_KEY: dans_v1_AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      DANS_RATE_LIMIT_ENABLED: "true"
      DANS_REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:${DANS_DEV_HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      powerdns:
        condition: service_started
      redis:
        condition: service_started
    networks: [control, ingress]

  cli:
    image: ${CLI_IMAGE:-busybox:1.37.0-musl}
    command: ["true"]
    profiles: [tools]
    networks: [control]

networks:
  control:
    internal: true
  ingress:
    driver: bridge

volumes:
  postgres-data:
  powerdns-data:
